<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>造景贴纸小憩 · 1:1复刻实景手帐</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #1a1614;
    }
    /* 全屏画板容器 */
    #worldViewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    /* 拟真贴纸层 */
    .sticker-element {
      position: absolute;
      touch-action: none;
      transform-origin: center center;
      transition: filter 0.15s cubic-bezier(0.2, 0.9, 0.3, 1);
      cursor: grab;
      filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.22));
    }
    .sticker-element:active, .sticker-element.is-dragging {
      cursor: grabbing;
      filter: drop-shadow(0 24px 30px rgba(0, 0, 0, 0.42)) drop-shadow(0 8px 12px rgba(0, 0, 0, 0.25)) !important;
      z-index: 9999 !important;
    }
    /* 拟真模切外边线 */
    .sticker-element img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    /* 贴纸册卡片质感 */
    .sticker-sheet-item {
      background: linear-gradient(135deg, rgba(255,255,255,0.95) 0%, rgba(246,242,235,0.85) 100%);
      box-shadow: 0 4px 10px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(255, 255, 255, 0.8);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sticker-sheet-item:active {
      transform: scale(0.9);
    }
    /* 选框控制点 */
    .selection-box {
      border: 2px dashed #f97316;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.8), inset 0 0 18px rgba(249, 115, 22, 0.1);
      pointer-events: none;
    }
    .handle-pin {
      pointer-events: auto;
      touch-action: none;
      transition: transform 0.15s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }
    .handle-pin:active {
      transform: scale(1.25);
    }
    /* 隐藏滚动条 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 贴纸册折叠抽屉动效 */
    #stickerDrawer {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #stickerDrawer.is-collapsed {
      transform: translateY(calc(100% - 48px));
    }
    /* 离型纸微孔背景 */
    .release-paper-bg {
      background-color: #faf7f2;
      background-image: radial-gradient(#dfd5c5 1px, transparent 1px);
      background-size: 10px 10px;
    }
  </style>
</head>
<body>

  <!-- 全屏沉浸式工作台 (占据 100% 视口，无边框拘束，大图尽收眼底) -->
  <div id="worldViewport">
    
    <!-- 房间舞台容器 (支持双指缩放和平移) -->
    <div id="roomStage" class="absolute inset-0 w-full h-full bg-cover bg-center select-none transition-transform duration-75">
      <!-- 裸房背景图 -->
      <div id="roomBackground" class="absolute inset-0 bg-cover bg-center pointer-events-none"></div>

      <!-- 丁达尔微尘与环境粒子 Canvas -->
      <canvas id="dustCanvas" class="absolute inset-0 pointer-events-none opacity-60 z-10"></canvas>

      <!-- 核心贴纸容器 -->
      <div id="stickerContainer" class="absolute inset-0 overflow-hidden z-20">
        <!-- 贴纸元素动态渲染在此 -->
      </div>

      <!-- 选中贴纸外框手柄 -->
      <div id="selectionOverlay" class="absolute inset-0 pointer-events-none hidden z-40">
        <div id="selectionBox" class="selection-box absolute rounded-2xl">
          <!-- 🪞 水平镜像翻转 -->
          <button id="pinFlip" class="handle-pin absolute -top-4 -left-4 w-8 h-8 rounded-full bg-white text-[#4a3b2b] flex items-center justify-center text-sm font-bold border border-[#d8c8b5]" title="水平镜像翻转">
            🪞
          </button>
          <!-- ✕ 撕掉删除 -->
          <button id="pinDelete" class="handle-pin absolute -top-4 -right-4 w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center text-sm font-bold border border-white/80" title="撕掉丢弃">
            ✕
          </button>
          <!-- ⬆️ 图层层级切换 -->
          <button id="pinLayer" class="handle-pin absolute -bottom-4 -left-4 w-8 h-8 rounded-full bg-white text-[#4a3b2b] flex items-center justify-center text-sm font-bold border border-[#d8c8b5]" title="置顶或下移">
            ⬆️
          </button>
          <!-- 🔄 复合旋转与缩放手柄 (单手拇指顺滑拉扯) -->
          <div id="pinTransform" class="handle-pin absolute -bottom-4 -right-4 w-8 h-8 rounded-full bg-[#f97316] text-white flex items-center justify-center text-sm font-bold border-2 border-white cursor-nwse-resize shadow-xl" title="按住拖拽自由旋转和缩放">
            🔄
          </div>
        </div>
      </div>
    </div>

    <!-- 顶层极简浮动 HUD (半透明毛玻璃，不遮挡视线) -->
    <header class="absolute top-3 left-3 right-3 flex items-center justify-between z-30 pointer-events-none">
      <!-- 裸房切换胶囊 -->
      <div class="pointer-events-auto bg-black/55 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/15 flex items-center gap-2 shadow-xl">
        <span class="text-xs text-white/70 font-medium">🏛️ 框架:</span>
        <select id="bareRoomSelect" class="bg-transparent text-xs text-white font-semibold outline-none cursor-pointer">
          <option value="room_bare_wood" class="text-stone-900" selected>🪵 温暖原木空房</option>
          <option value="room_bare_vintage" class="text-stone-900">🏛️ 复古砖木空房</option>
          <option value="room_bare_sunroom" class="text-stone-900">🌿 全景玻璃花房</option>
          <option value="bg_sunset" class="text-stone-900">🌅 拱窗日落空房</option>
        </select>
      </div>

      <!-- 右侧工具胶囊 -->
      <div class="pointer-events-auto flex items-center gap-1.5 bg-black/55 backdrop-blur-md p-1 rounded-full border border-white/15 shadow-xl">
        <!-- 氛围音效切换 -->
        <button id="ambientBtn" class="px-2.5 py-1 rounded-full text-xs text-white/90 font-medium hover:bg-white/15 active:scale-95 transition-all flex items-center gap-1" title="切换背景白噪音">
          <span id="ambientIcon">🌧️</span>
          <span id="ambientLabel" class="text-[11px] hidden sm:inline">雨声</span>
        </button>

        <!-- 🔮 AI定制贴纸 -->
        <button id="openAiBtn" class="px-2.5 py-1 rounded-full text-xs bg-gradient-to-r from-orange-500 to-amber-500 text-white font-semibold shadow-xs active:scale-95 transition-all flex items-center gap-1" title="Grok AI 实时画贴纸">
          <span>🔮</span><span class="text-[11px]">AI定制</span>
        </button>

        <!-- 清空重置 -->
        <button id="clearBtn" class="p-1.5 rounded-full text-xs text-red-300 hover:bg-white/15 active:scale-95 transition-all" title="清空全部贴纸，从零打造">
          🗑️
        </button>

        <!-- 保存壁纸 -->
        <button id="exportBtn" class="px-3 py-1 rounded-full text-xs bg-[#e76f51] text-white font-bold shadow-md hover:bg-[#d95d3f] active:scale-95 transition-all flex items-center gap-1">
          <span>📸</span><span>保存</span>
        </button>
      </div>
    </header>

    <!-- 开局空状态沉浸式新手向导 (只有在 0 贴纸时显示) -->
    <div id="blankStartHint" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center px-6 z-20 transition-opacity duration-300">
      <div class="bg-black/60 backdrop-blur-md border border-white/20 text-white px-5 py-3.5 rounded-3xl shadow-2xl flex flex-col items-center gap-1.5 max-w-xs">
        <span class="text-3xl animate-bounce">✨</span>
        <h2 class="text-sm font-bold tracking-tight">1:1 从零打造你的房间</h2>
        <p class="text-[11px] text-white/75 leading-relaxed">
          开局是一间完全空旷的毛坯房。<br>从下方贴纸册选择门窗、地毯、家具，亲手把空房间一点点填满吧！
        </p>
        <span class="text-[10px] text-amber-300 mt-1">👇 点击下方贴纸册撕下第一张贴纸</span>
      </div>
    </div>

    <!-- 底部抽屉式离型贴纸册 (可折叠 / 可展开，彻底解放屏幕空间) -->
    <footer id="stickerDrawer" class="absolute bottom-0 left-0 right-0 z-30 flex flex-col release-paper-bg border-t-2 border-[#d9ccba] shadow-[0_-8px_30px_rgba(0,0,0,0.25)] rounded-t-3xl overflow-hidden max-h-[340px]">
      
      <!-- 抽屉顶部把手与分类标签栏 (点击把手折叠/展开) -->
      <div id="drawerHeader" class="px-3 pt-2 pb-1.5 flex flex-col gap-1 border-b border-[#e2d5c3] bg-[#f2e9dc] cursor-pointer">
        <!-- 居中滑动把手条 -->
        <div class="w-10 h-1 rounded-full bg-[#baa691] mx-auto opacity-75"></div>

        <div class="flex items-center justify-between gap-1 overflow-x-auto no-scrollbar pt-1">
          <div class="flex items-center gap-1 shrink-0">
            <button data-cat="windows" class="cat-tab px-2.5 py-1 rounded-full text-xs font-semibold bg-[#d97d54] text-white transition-all shadow-xs">
              🪟 ①门窗
            </button>
            <button data-cat="rugs" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🧱 ②地毯墙面
            </button>
            <button data-cat="big_furniture" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🛋️ ③大件家具
            </button>
            <button data-cat="small_furniture" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🪑 ④桌椅小件
            </button>
            <button data-cat="plants" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🌿 ⑤绿植盆栽
            </button>
            <button data-cat="pets" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🐱 ⑥治愈萌宠
            </button>
            <button data-cat="props" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              ☕ ⑦美食微缩
            </button>
            <button data-cat="custom" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              ✨ ⑧我的定制
            </button>
          </div>
          <button id="toggleDrawerBtn" class="shrink-0 p-1 text-xs text-[#8c7866] font-bold">
            ▼
          </button>
        </div>
      </div>

      <!-- 贴纸册展示格子区 (拟真离型底纸) -->
      <div id="stickersGrid" class="p-3 grid grid-cols-4 sm:grid-cols-6 gap-2.5 overflow-y-auto max-h-[220px] no-scrollbar">
        <!-- 动态渲染贴纸卡片 -->
      </div>
    </footer>

  </div>

  <!-- 🔮 Grok AI 贴纸工坊模态框 -->
  <div id="aiModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#faf6f0] rounded-3xl p-5 max-w-sm w-full flex flex-col gap-3.5 border border-[#e5d8c7] shadow-2xl relative">
      <button id="closeAiBtn" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-stone-200 text-stone-600 flex items-center justify-center text-sm font-bold">
        ✕
      </button>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-xl">🔮</span>
          <h3 class="font-bold text-base text-[#4a3b2b]">Grok AI 贴纸工坊</h3>
        </div>
        <p class="text-xs text-[#826f5d] mt-1">自己想要什么贴纸，输入一句话直接画出来！</p>
      </div>

      <!-- 灵感 Chips -->
      <div class="flex flex-wrap gap-1.5">
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🍓 草莓抹茶芭菲杯</span>
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🧶 玩毛线球的折耳猫</span>
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🎸 复古原木电吉他</span>
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🌙 悬浮流光小月球灯</span>
      </div>

      <div class="flex flex-col gap-2">
        <input id="aiInput" type="text" placeholder="输入想要的贴纸，如：日落落地大拱窗..." class="w-full px-3.5 py-2.5 rounded-xl border border-[#d8c8b5] bg-white text-xs outline-none focus:ring-2 focus:ring-[#e76f51] text-[#4a3b2b]">
        <button id="doGenerateBtn" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-[#e76f51] to-[#f4a261] text-white text-xs font-bold shadow-md active:scale-95 transition-all flex items-center justify-center gap-1.5">
          <span id="aiSpinner" class="hidden animate-spin">⏳</span>
          <span id="aiBtnText">✨ 立即绘制专属贴纸</span>
        </button>
      </div>
      <div id="aiStatus" class="text-[11px] text-center text-[#8d7966] hidden">
        Grok 正在绘制中并进行透明白边处理，约 10 秒...
      </div>
    </div>
  </div>

  <!-- 📸 导出高清壁纸海报弹窗 -->
  <div id="exportModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#faf6f0] rounded-3xl p-5 max-w-sm w-full flex flex-col items-center gap-4 border border-[#e5d8c7] shadow-2xl">
      <div class="text-center">
        <h3 class="font-bold text-base text-[#4a3b2b]">🎉 你的微缩造景诞生了！</h3>
        <p class="text-xs text-[#826f5d] mt-1">从零打造的专属小屋，长按保存壁纸</p>
      </div>
      <div class="w-full rounded-2xl overflow-hidden border-4 border-white shadow-xl bg-stone-900">
        <img id="exportPreview" src="" alt="Diorama Export" class="w-full h-auto block">
      </div>
      <div class="flex items-center gap-2 w-full">
        <button id="closeExportBtn" class="flex-1 py-2.5 rounded-xl bg-white border border-[#d8c8b5] text-xs font-semibold text-[#6f5e4d] active:scale-95">
          返回继续打造
        </button>
        <a id="downloadBtn" download="my_custom_room.png" class="flex-1 py-2.5 text-center rounded-xl bg-[#d97d54] text-white text-xs font-bold shadow-md active:scale-95">
          📥 下载到手机
        </a>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. 沉浸式环境音效引擎 (零依赖 Web Audio API)
       ========================================================================== */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.ambience = 'rain'; // 'rain', 'fire', 'lofi', 'mute'
        this.nodes = [];
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      cycleAmbience() {
        this.init();
        const list = ['rain', 'fire', 'lofi', 'mute'];
        const next = list[(list.indexOf(this.ambience) + 1) % list.length];
        this.setAmbience(next);
      }
      setAmbience(mode) {
        this.stopAmbience();
        this.ambience = mode;
        const icon = document.getElementById('ambientIcon');
        const label = document.getElementById('ambientLabel');

        if (mode === 'rain') {
          icon.innerText = '🌧️';
          label.innerText = '雨声';
          this.playRain();
        } else if (mode === 'fire') {
          icon.innerText = '🪵';
          label.innerText = '壁炉';
          this.playFire();
        } else if (mode === 'lofi') {
          icon.innerText = '🎵';
          label.innerText = 'Lofi';
          this.playLofi();
        } else {
          icon.innerText = '🔇';
          label.innerText = '静音';
        }
      }
      stopAmbience() {
        this.nodes.forEach(n => {
          try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
      }
      playRain() {
        if (!this.ctx) return;
        try {
          const sz = this.ctx.sampleRate * 2;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
          const src = this.ctx.createBufferSource();
          src.buffer = b;
          src.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'lowpass';
          f.frequency.value = 850;
          const g = this.ctx.createGain();
          g.gain.value = 0.08;
          src.connect(f);
          f.connect(g);
          g.connect(this.ctx.destination);
          src.start();
          this.nodes.push(src, f, g);
        } catch (e) {}
      }
      playFire() {
        if (!this.ctx) return;
        try {
          const sz = this.ctx.sampleRate * 2;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
          const src = this.ctx.createBufferSource();
          src.buffer = b;
          src.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'lowpass';
          f.frequency.value = 350;
          const g = this.ctx.createGain();
          g.gain.value = 0.12;
          src.connect(f);
          f.connect(g);
          g.connect(this.ctx.destination);
          src.start();
          this.nodes.push(src, f, g);
        } catch (e) {}
      }
      playLofi() {
        if (!this.ctx) return;
        const chords = [
          [261.63, 329.63, 392.00, 493.88],
          [220.00, 261.63, 329.63, 392.00],
          [174.61, 220.00, 261.63, 329.63]
        ];
        let idx = 0;
        const timer = setInterval(() => {
          if (this.ambience !== 'lofi' || !this.ctx) {
            clearInterval(timer);
            return;
          }
          const chord = chords[idx];
          idx = (idx + 1) % chords.length;
          chord.forEach((freq, i) => {
            setTimeout(() => {
              if (this.ambience !== 'lofi' || !this.ctx) return;
              try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0005, this.ctx.currentTime + 1.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 1.6);
              } catch (e) {}
            }, i * 120);
          });
        }, 3200);
      }
      playPeel() {
        this.init();
        if (!this.ctx) return;
        try {
          const sz = this.ctx.sampleRate * 0.12;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sz * 0.35));
          const src = this.ctx.createBufferSource();
          src.buffer = b;
          const f = this.ctx.createBiquadFilter();
          f.type = 'bandpass';
          f.frequency.setValueAtTime(1600, this.ctx.currentTime);
          f.frequency.exponentialRampToValueAtTime(3600, this.ctx.currentTime + 0.1);
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.32, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          src.connect(f);
          f.connect(g);
          g.connect(this.ctx.destination);
          src.start();
          if (navigator.vibrate) navigator.vibrate(10);
        } catch (e) {}
      }
      playStick() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.09);
          if (navigator.vibrate) navigator.vibrate([12, 20, 8]);
        } catch (e) {}
      }
      playClick() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(950, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.025);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.025);
          if (navigator.vibrate) navigator.vibrate(6);
        } catch (e) {}
      }
      playDelete() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        } catch (e) {}
      }
    }

    /* ==========================================================================
       3. 动态光影微尘粒子系统
       ========================================================================== */
    class DustParticleSystem {
      constructor(canvasId) {
        this.canvas = document.getElementById(canvasId);
        this.ctx = this.canvas.getContext('2d');
        this.particles = [];
        this.resize();
        window.addEventListener('resize', () => this.resize());
        this.init();
        this.animate();
      }
      resize() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
      }
      init() {
        this.particles = [];
        for (let i = 0; i < 28; i++) {
          this.particles.push({
            x: Math.random() * this.canvas.width,
            y: Math.random() * this.canvas.height,
            r: Math.random() * 2 + 0.8,
            vx: (Math.random() - 0.5) * 0.4,
            vy: -Math.random() * 0.35 - 0.05
          });
        }
      }
      animate() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.ctx.fillStyle = 'rgba(254, 240, 138, 0.45)';
        for (let p of this.particles) {
          p.x += p.vx;
          p.y += p.vy;
          if (p.y < 0) p.y = this.canvas.height;
          if (p.x < 0) p.x = this.canvas.width;
          if (p.x > this.canvas.width) p.x = 0;
          this.ctx.beginPath();
          this.ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          this.ctx.fill();
        }
        requestAnimationFrame(() => this.animate());
      }
    }

    /* ==========================================================================
       4. 核心应用控制器 (全屏平移缩放 + 拟真1:1撕贴交互)
       ========================================================================== */
    class DioramaApp {
      constructor() {
        this.placedStickers = []; // 初始空旷，完全由玩家亲手打造！
        this.activeId = null;
        this.currentBareRoom = 'room_bare_wood';
        this.currentCategory = 'windows';
        this.globalZCounter = 100;

        // DOM
        this.viewport = document.getElementById('worldViewport');
        this.stage = document.getElementById('roomStage');
        this.roomBg = document.getElementById('roomBackground');
        this.container = document.getElementById('stickerContainer');
        this.overlay = document.getElementById('selectionOverlay');
        this.selectionBox = document.getElementById('selectionBox');
        this.drawer = document.getElementById('stickerDrawer');
        this.grid = document.getElementById('stickersGrid');
        this.hint = document.getElementById('blankStartHint');

        this.dust = new DustParticleSystem('dustCanvas');

        this.init();
      }

      init() {
        this.setBareRoom(this.currentBareRoom);
        this.renderDrawer(this.currentCategory);
        this.bindEvents();
        this.bindStickerControls();
      }

      setBareRoom(roomKey) {
        if (!BARE_ROOMS[roomKey]) return;
        this.currentBareRoom = roomKey;
        this.roomBg.style.backgroundImage = `url('${BARE_ROOMS[roomKey].bg}')`;
        document.getElementById('bareRoomSelect').value = roomKey;
        audio.playClick();
      }

      renderDrawer(cat) {
        this.currentCategory = cat;
        const all = [...customStickers, ...STICKER_LIBRARY];
        const list = cat === 'custom' ? customStickers : all.filter(s => s.cat === cat);

        if (list.length === 0) {
          this.grid.innerHTML = `
            <div class="col-span-4 sm:col-span-6 py-8 text-center text-xs text-[#8c7866]">
              暂无贴纸，点击顶部「🔮 AI定制」随心画一张！
            </div>
          `;
          return;
        }

        this.grid.innerHTML = list.map(item => `
          <div class="sticker-sheet-item rounded-2xl p-1.5 flex flex-col items-center justify-between border border-[#decbb8] cursor-pointer" data-id="${item.id}">
            <div class="w-full h-14 flex items-center justify-center p-0.5 pointer-events-none">
              <img src="${item.img}" alt="${item.name}" class="max-w-full max-h-full object-contain filter drop-shadow(0 2px 5px rgba(0,0,0,0.15))">
            </div>
            <span class="text-[10px] text-[#735e4b] font-medium tracking-tight mt-1 truncate w-full text-center pointer-events-none">
              ${item.name}
            </span>
          </div>
        `).join('');
      }

      // 添加贴纸至房间
      addSticker(templateId, initialPos = null) {
        const all = [...customStickers, ...STICKER_LIBRARY];
        const tpl = all.find(s => s.id === templateId);
        if (!tpl) return;

        audio.playPeel();

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const posX = initialPos ? initialPos.x : (vw / 2 - tpl.width / 2);
        const posY = initialPos ? initialPos.y : (vh / 2 - tpl.height / 2 - 40);

        this.globalZCounter += 1;
        const instance = {
          uid: 'stk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          templateId: tpl.id,
          name: tpl.name,
          img: tpl.img,
          x: Math.max(10, Math.min(vw - tpl.width, posX)),
          y: Math.max(10, Math.min(vh - tpl.height, posY)),
          width: tpl.width,
          height: tpl.height,
          rotation: 0,
          scale: 1,
          flipped: false,
          zIndex: tpl.baseZ ? tpl.baseZ : this.globalZCounter
        };

        this.placedStickers.push(instance);
        this.renderAll();
        this.selectSticker(instance.uid);

        setTimeout(() => audio.playStick(), 60);
        this.updateHint();

        // 放置后自动轻微收缩抽屉，让出大屏视野
        this.collapseDrawer();
      }

      renderAll() {
        this.container.innerHTML = '';
        this.placedStickers.forEach(item => {
          const el = document.createElement('div');
          el.id = item.uid;
          el.className = 'sticker-element';
          el.style.width = item.width + 'px';
          el.style.height = item.height + 'px';
          el.style.left = item.x + 'px';
          el.style.top = item.y + 'px';
          el.style.zIndex = item.zIndex;

          const transformStr = `rotate(${item.rotation}deg) scale(${item.scale}) scaleX(${item.flipped ? -1 : 1})`;
          el.style.transform = transformStr;

          el.innerHTML = `
            <img src="${item.img}" class="pointer-events-none">
          `;

          this.attachPointerGestures(el, item);
          this.container.appendChild(el);
        });

        this.updateSelectionBoxPosition();
      }

      attachPointerGestures(el, item) {
        let isDragging = false;
        let startX, startY;
        let origX, origY;
        let activePointers = new Map();
        let initialDistance = 0;
        let initialScale = 1;

        const onPointerDown = (e) => {
          e.stopPropagation();
          this.selectSticker(item.uid);
          audio.playPeel();

          el.setPointerCapture(e.pointerId);
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (activePointers.size === 1) {
            isDragging = true;
            el.classList.add('is-dragging');
            startX = e.clientX;
            startY = e.clientY;
            origX = item.x;
            origY = item.y;
          } else if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            initialDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            initialScale = item.scale;
          }
        };

        const onPointerMove = (e) => {
          if (!activePointers.has(e.pointerId)) return;
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (activePointers.size === 1 && isDragging) {
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            item.x = origX + deltaX;
            item.y = origY + deltaY;

            el.style.left = item.x + 'px';
            el.style.top = item.y + 'px';
            this.updateSelectionBoxPosition();
          } else if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            if (initialDistance > 0) {
              item.scale = Math.max(0.3, Math.min(3.2, initialScale * (curDist / initialDistance)));
              el.style.transform = `rotate(${item.rotation}deg) scale(${item.scale}) scaleX(${item.flipped ? -1 : 1})`;
              this.updateSelectionBoxPosition();
            }
          }
        };

        const onPointerUp = (e) => {
          try { el.releasePointerCapture(e.pointerId); } catch (err) {}
          activePointers.delete(e.pointerId);

          if (activePointers.size === 0 && isDragging) {
            isDragging = false;
            el.classList.remove('is-dragging');
            audio.playStick();
          }
        };

        el.addEventListener('pointerdown', onPointerDown);
        el.addEventListener('pointermove', onPointerMove);
        el.addEventListener('pointerup', onPointerUp);
        el.addEventListener('pointercancel', onPointerUp);
      }

      selectSticker(uid) {
        this.activeId = uid;
        this.overlay.classList.remove('hidden');
        this.updateSelectionBoxPosition();
      }

      deselectAll() {
        this.activeId = null;
        this.overlay.classList.add('hidden');
      }

      getActive() {
        return this.placedStickers.find(s => s.uid === this.activeId);
      }

      updateSelectionBoxPosition() {
        const active = this.getActive();
        if (!active || !this.activeId) {
          this.overlay.classList.add('hidden');
          return;
        }

        const padding = 12;
        const w = active.width * active.scale;
        const h = active.height * active.scale;
        const cx = active.x + active.width / 2;
        const cy = active.y + active.height / 2;

        this.selectionBox.style.width = (w + padding * 2) + 'px';
        this.selectionBox.style.height = (h + padding * 2) + 'px';
        this.selectionBox.style.left = (cx - (w + padding * 2) / 2) + 'px';
        this.selectionBox.style.top = (cy - (h + padding * 2) / 2) + 'px';
        this.selectionBox.style.transform = `rotate(${active.rotation}deg)`;
        this.overlay.classList.remove('hidden');
      }

      bindStickerControls() {
        // 1. 翻转
        document.getElementById('pinFlip').addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const active = this.getActive();
          if (!active) return;
          active.flipped = !active.flipped;
          this.renderAll();
          audio.playClick();
        });

        // 2. 撕掉丢弃
        document.getElementById('pinDelete').addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (!this.activeId) return;
          const target = document.getElementById(this.activeId);
          if (target) {
            target.style.transition = 'all 0.15s ease-out';
            target.style.transform += ' scale(0)';
            target.style.opacity = '0';
          }
          audio.playDelete();
          setTimeout(() => {
            this.placedStickers = this.placedStickers.filter(s => s.uid !== this.activeId);
            this.deselectAll();
            this.renderAll();
            this.updateHint();
          }, 150);
        });

        // 3. 层级调整
        document.getElementById('pinLayer').addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const active = this.getActive();
          if (!active) return;
          this.globalZCounter += 1;
          active.zIndex = this.globalZCounter;
          this.renderAll();
          audio.playClick();
        });

        // 4. 复合旋转缩放手柄
        const handle = document.getElementById('pinTransform');
        let isT = false;
        let startAngle = 0;
        let startDist = 0;
        let initRot = 0;
        let initScale = 1;

        handle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const active = this.getActive();
          if (!active) return;

          handle.setPointerCapture(e.pointerId);
          isT = true;
          audio.playClick();

          const rect = this.container.getBoundingClientRect();
          const cx = rect.left + active.x + active.width / 2;
          const cy = rect.top + active.y + active.height / 2;

          startAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
          startDist = Math.hypot(e.clientX - cx, e.clientY - cy);
          initRot = active.rotation;
          initScale = active.scale;

          const onPointerMove = (mEvt) => {
            if (!isT) return;
            const curAngle = Math.atan2(mEvt.clientY - cy, mEvt.clientX - cx);
            const curDist = Math.hypot(mEvt.clientX - cy, mEvt.clientX - cx);

            const deltaRot = (curAngle - startAngle) * (180 / Math.PI);
            active.rotation = Math.round((initRot + deltaRot) % 360);

            const scaleMul = curDist / (startDist || 1);
            active.scale = Math.max(0.3, Math.min(3.2, initScale * scaleMul));

            const targetEl = document.getElementById(active.uid);
            if (targetEl) {
              targetEl.style.transform = `rotate(${active.rotation}deg) scale(${active.scale}) scaleX(${active.flipped ? -1 : 1})`;
            }
            this.updateSelectionBoxPosition();
          };

          const onPointerUp = (uEvt) => {
            try { handle.releasePointerCapture(uEvt.pointerId); } catch (err) {}
            isT = false;
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
          };

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
        });
      }

      collapseDrawer() {
        this.drawer.classList.add('is-collapsed');
        document.getElementById('toggleDrawerBtn').innerText = '▲';
      }

      expandDrawer() {
        this.drawer.classList.remove('is-collapsed');
        document.getElementById('toggleDrawerBtn').innerText = '▼';
      }

      updateHint() {
        this.hint.style.opacity = this.placedStickers.length === 0 ? '1' : '0';
      }

      bindEvents() {
        // 裸房框架切换
        document.getElementById('bareRoomSelect').addEventListener('change', (e) => {
          this.setBareRoom(e.target.value);
        });

        // 抽屉展开/折叠
        document.getElementById('drawerHeader').addEventListener('click', (e) => {
          if (e.target.closest('.cat-tab')) return;
          if (this.drawer.classList.contains('is-collapsed')) {
            this.expandDrawer();
          } else {
            this.collapseDrawer();
          }
          audio.playClick();
        });

        // 贴纸分类标签切换
        document.querySelectorAll('.cat-tab').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.playClick();
            document.querySelectorAll('.cat-tab').forEach(b => {
              b.className = 'cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all';
            });
            btn.className = 'cat-tab px-2.5 py-1 rounded-full text-xs font-semibold bg-[#d97d54] text-white transition-all shadow-xs';
            this.renderDrawer(btn.dataset.cat);
            this.expandDrawer();
          });
        });

        // 点击贴纸册撕下
        this.grid.addEventListener('click', (e) => {
          const card = e.target.closest('.sticker-sheet-item');
          if (card) {
            this.addSticker(card.dataset.id);
          }
        });

        // 点击舞台空白处取消选择
        this.viewport.addEventListener('pointerdown', (e) => {
          if (e.target === this.viewport || e.target === this.stage || e.target.id === 'roomBackground' || e.target.id === 'dustCanvas') {
            this.deselectAll();
          }
        });

        // 环境白噪音切换
        document.getElementById('ambientBtn').addEventListener('click', () => {
          audio.cycleAmbience();
        });

        // 清空
        document.getElementById('clearBtn').addEventListener('click', () => {
          if (this.placedStickers.length === 0) return;
          if (confirm('确定要清空房间吗？将从一张空白裸房重新开始打造！')) {
            this.placedStickers = [];
            this.deselectAll();
            this.renderAll();
            this.updateHint();
            audio.playDelete();
          }
        });

        // 导出
        document.getElementById('exportBtn').addEventListener('click', () => {
          this.exportImage();
        });

        document.getElementById('closeExportBtn').addEventListener('click', () => {
          document.getElementById('exportModal').classList.add('hidden');
        });
      }

      // 高清合成导出
      exportImage() {
        audio.playClick();
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = 2; // 2x 视网膜高清
        const canvas = document.createElement('canvas');
        canvas.width = vw * scale;
        canvas.height = vh * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        const currentBg = BARE_ROOMS[this.currentBareRoom];
        const bgImg = new Image();
        bgImg.crossOrigin = 'anonymous';

        const finish = () => {
          const sorted = [...this.placedStickers].sort((a, b) => a.zIndex - b.zIndex);
          if (sorted.length === 0) {
            this.showExport(canvas.toDataURL('image/png'));
            return;
          }

          let loaded = 0;
          sorted.forEach(item => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            img.onload = () => {
              ctx.save();
              ctx.translate(item.x + item.width / 2, item.y + item.height / 2);
              ctx.rotate((item.rotation * Math.PI) / 180);
              ctx.scale(item.flipped ? -item.scale : item.scale, item.scale);
              ctx.drawImage(img, -item.width / 2, -item.height / 2, item.width, item.height);
              ctx.restore();

              loaded++;
              if (loaded === sorted.length) {
                // 拍立得水印相框
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 10;
                ctx.strokeRect(5, 5, vw - 10, vh - 10);
                ctx.font = 'bold 12px sans-serif';
                ctx.fillStyle = '#ffffff';
                ctx.fillText(`✨ ${currentBg.name} · 我的造景小屋`, 20, vh - 22);

                this.showExport(canvas.toDataURL('image/png'));
              }
            };
            img.onerror = () => {
              loaded++;
              if (loaded === sorted.length) {
                this.showExport(canvas.toDataURL('image/png'));
              }
            };
            img.src = item.img;
          });
        };

        bgImg.onload = () => {
          // 铺满裁剪
          const imgRatio = bgImg.width / bgImg.height;
          const screenRatio = vw / vh;
          let dw, dh, dx, dy;
          if (screenRatio > imgRatio) {
            dw = vw;
            dh = vw / imgRatio;
            dx = 0;
            dy = (vh - dh) / 2;
          } else {
            dh = vh;
            dw = vh * imgRatio;
            dx = (vw - dw) / 2;
            dy = 0;
          }
          ctx.drawImage(bgImg, dx, dy, dw, dh);
          finish();
        };
        bgImg.onerror = () => {
          ctx.fillStyle = '#1a1614';
          ctx.fillRect(0, 0, vw, vh);
          finish();
        };
        bgImg.src = currentBg.bg;
      }

      showExport(dataUrl) {
        document.getElementById('exportPreview').src = dataUrl;
        document.getElementById('downloadBtn').href = dataUrl;
        document.getElementById('exportModal').classList.remove('hidden');
      }
    }

    /* ==========================================================================
       5. 🔮 Grok AI 贴纸工坊
       ========================================================================== */
    class AiWorkshop {
      constructor(app) {
        this.app = app;
        this.apiKey = 'sk-Tkh8xl7XqIlbiGje1wI9g6HJBnCSZqFBm2W9ym5Q';
        this.modal = document.getElementById('aiModal');
        this.input = document.getElementById('aiInput');
        this.btn = document.getElementById('doGenerateBtn');
        this.spinner = document.getElementById('aiSpinner');
        this.btnText = document.getElementById('aiBtnText');
        this.status = document.getElementById('aiStatus');

        this.bindEvents();
      }

      bindEvents() {
        document.getElementById('openAiBtn').addEventListener('click', () => {
          this.modal.classList.remove('hidden');
          audio.playClick();
        });

        document.getElementById('closeAiBtn').addEventListener('click', () => {
          this.modal.classList.add('hidden');
        });

        document.querySelectorAll('.prompt-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            this.input.value = chip.innerText.replace(/^[^\s]+\s*/, '');
            audio.playClick();
          });
        });

        this.btn.addEventListener('click', () => this.generate());
      }

      async generate() {
        const val = this.input.value.trim();
        if (!val) {
          alert('请先输入想画的物品名称！');
          return;
        }

        this.btn.disabled = true;
        this.spinner.classList.remove('hidden');
        this.btnText.innerText = 'Grok 正在绘制中...';
        this.status.classList.remove('hidden');
        audio.playPeel();

        const fullPrompt = `Die-cut sticker of ${val}, cute cozy anime cartoon style, thick white sticker border outline, solid pure white background, 2d sticker design`;

        try {
          const resp = await fetch('https://img.pipiwangcom.com/v1/images/generations', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${this.apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'grok-2-imageGen',
              prompt: fullPrompt,
              n: 1,
              size: '1024x1024'
            })
          });

          const data = await resp.json();
          if (!data.data || !data.data[0] || !data.data[0].url) {
            throw new Error('未返回有效图片');
          }

          const rawUrl = data.data[0].url;
          this.btnText.innerText = '正在进行背景透明处理...';

          const transparentPng = await this.removeWhite(rawUrl);

          const newSticker = {
            id: 'custom_' + Date.now(),
            cat: 'custom',
            name: val.slice(0, 8),
            img: transparentPng,
            width: 95,
            height: 95
          };

          customStickers.unshift(newSticker);
          localStorage.setItem('my_custom_stickers', JSON.stringify(customStickers));

          this.modal.classList.add('hidden');
          this.input.value = '';
          this.app.renderDrawer('custom');
          this.app.addSticker(newSticker.id);
          audio.playStick();

          alert('🎉 你的专属贴纸已绘制完成，已贴入房间！');
        } catch (e) {
          alert('绘制失败，请重试：' + (e.message || e));
        } finally {
          this.btn.disabled = false;
          this.spinner.classList.add('hidden');
          this.btnText.innerText = '✨ 立即绘制专属贴纸';
          this.status.classList.add('hidden');
        }
      }

      removeWhite(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const targetSize = 400;
            canvas.width = targetSize;
            canvas.height = targetSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, targetSize, targetSize);

            const imgData = ctx.getImageData(0, 0, targetSize, targetSize);
            const d = imgData.data;
            const w = targetSize;
            const h = targetSize;

            const visited = new Uint8Array(w * h);
            const queue = [];

            const isWhite = (x, y) => {
              const idx = (y * w + x) * 4;
              return d[idx] > 232 && d[idx+1] > 232 && d[idx+2] > 232;
            };

            for (let x = 0; x < w; x++) {
              if (isWhite(x, 0)) { queue.push(x, 0); visited[x] = 1; }
              if (isWhite(x, h - 1)) { queue.push(x, h - 1); visited[(h - 1) * w + x] = 1; }
            }
            for (let y = 0; y < h; y++) {
              if (isWhite(0, y) && !visited[y * w]) { queue.push(0, y); visited[y * w] = 1; }
              if (isWhite(w - 1, y) && !visited[y * w + (w - 1)]) { queue.push(w - 1, y); visited[y * w + (w - 1)] = 1; }
            }

            let head = 0;
            while (head < queue.length) {
              const cx = queue[head++];
              const cy = queue[head++];
              const idx = (cy * w + cx) * 4;
              d[idx + 3] = 0;

              const neighbors = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
              for (let [nx, ny] of neighbors) {
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                  const nPos = ny * w + nx;
                  if (!visited[nPos] && isWhite(nx, ny)) {
                    visited[nPos] = 1;
                    queue.push(nx, ny);
                  }
                }
              }
            }

            ctx.putImageData(imgData, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = () => resolve(url);
          img.src = url;
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new DioramaApp();
      window.aiWorkshop = new AiWorkshop(window.app);
    });
  </script>
