<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>造景贴纸小憩 · 2D平面手帐拼贴</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #26201b;
    }
    /* 全屏手帐画板 */
    #journalViewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }
    /* 手帐纸张纹理与点阵网格 (纯2D平面底纸) */
    .journal-paper-cream {
      background-color: #faf5ec;
      background-image: 
        linear-gradient(rgba(180, 160, 140, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180, 160, 140, 0.12) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .journal-paper-kraft {
      background-color: #eee1cc;
      background-image: radial-gradient(rgba(120, 95, 70, 0.14) 1px, transparent 1px);
      background-size: 16px 16px;
    }
    .journal-paper-white {
      background-color: #fbfbfb;
      background-image: 
        linear-gradient(rgba(200, 200, 200, 0.15) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200, 200, 200, 0.15) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* 水平平直地板胶带 (划分天地两分法) */
    .floor-wood-strip {
      background: linear-gradient(180deg, #9b6c42 0%, #b88657 8%, #8d5e35 100%);
      box-shadow: 0 -3px 8px rgba(0,0,0,0.15);
      border-top: 3px solid #633f20;
    }
    .floor-tile-strip {
      background-color: #eae5dc;
      background-image: 
        linear-gradient(45deg, #38332e 25%, transparent 25%), 
        linear-gradient(-45deg, #38332e 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #38332e 75%), 
        linear-gradient(-45deg, transparent 75%, #38332e 75%);
      background-size: 32px 32px;
      background-position: 0 0, 0 16px, 16px -16px, -16px 0px;
      border-top: 3px solid #231f1c;
      box-shadow: 0 -3px 8px rgba(0,0,0,0.15);
    }
    .floor-grass-strip {
      background: linear-gradient(180deg, #5b8c5a 0%, #4a7549 100%);
      border-top: 3px solid #365935;
      box-shadow: 0 -3px 8px rgba(0,0,0,0.15);
    }

    /* 纯 2D 平面贴纸物理浮起与模切白边 */
    .flat-sticker-node {
      position: absolute;
      touch-action: none;
      transform-origin: center center;
      transition: filter 0.15s cubic-bezier(0.2, 0.9, 0.3, 1);
      cursor: grab;
      filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.16));
    }
    .flat-sticker-node:active, .flat-sticker-node.is-dragging {
      cursor: grabbing;
      filter: drop-shadow(0 20px 25px rgba(0, 0, 0, 0.32)) drop-shadow(0 6px 10px rgba(0, 0, 0, 0.18)) !important;
      z-index: 9999 !important;
    }
    .flat-sticker-node img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* 贴纸卡片质感 */
    .sticker-tray-card {
      background: #ffffff;
      box-shadow: 0 3px 8px rgba(0,0,0,0.06), inset 0 0 0 1px rgba(0,0,0,0.04);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .sticker-tray-card:active {
      transform: scale(0.92);
    }

    /* 选框控制点 */
    .selection-box {
      border: 2px dashed #e76f51;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.8), inset 0 0 15px rgba(231, 111, 81, 0.08);
      pointer-events: none;
    }
    .handle-pin {
      pointer-events: auto;
      touch-action: none;
      transition: transform 0.15s ease;
      box-shadow: 0 3px 8px rgba(0,0,0,0.25);
    }
    .handle-pin:active {
      transform: scale(1.25);
    }

    /* 隐藏滚动条 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 抽屉式收纳动画 */
    #stickerDrawer {
      transition: transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #stickerDrawer.is-collapsed {
      transform: translateY(calc(100% - 46px));
    }
  </style>
</head>
<body>

  <!-- 全屏手帐画板视口 (纯 2D 平面，天地两分横平竖直) -->
  <div id="journalViewport" class="journal-paper-cream">
    
    <!-- 房间舞台容器 -->
    <div id="journalCanvas" class="absolute inset-0 w-full h-full select-none">
      
      <!-- 底部平直地面胶带 (水平地平线，家具脚部直接踩在此处) -->
      <div id="floorStrip" class="floor-wood-strip absolute bottom-0 left-0 right-0 h-[22%] pointer-events-none transition-all duration-300">
        <!-- 踢脚线微阴影 -->
        <div class="w-full h-1.5 bg-black/15"></div>
      </div>

      <!-- 贴纸物理摆放容器 -->
      <div id="stickerContainer" class="absolute inset-0 overflow-hidden z-20">
        <!-- 纯平面贴纸动态渲染在此 -->
      </div>

      <!-- 选中贴纸外框手柄 -->
      <div id="selectionOverlay" class="absolute inset-0 pointer-events-none hidden z-40">
        <div id="selectionBox" class="selection-box absolute rounded-2xl">
          <!-- 🪞 水平镜像翻转 -->
          <button id="pinFlip" class="handle-pin absolute -top-4 -left-4 w-8 h-8 rounded-full bg-white text-[#4a3b2b] flex items-center justify-center text-sm font-bold border border-[#d8c8b5]" title="水平镜像翻转">
            🪞
          </button>
          <!-- ✕ 撕掉删除 -->
          <button id="pinDelete" class="handle-pin absolute -top-4 -right-4 w-8 h-8 rounded-full bg-red-500 text-white flex items-center justify-center text-sm font-bold border border-white/80" title="撕掉丢弃">
            ✕
          </button>
          <!-- ⬆️ 图层层级循环 -->
          <button id="pinLayer" class="handle-pin absolute -bottom-4 -left-4 w-8 h-8 rounded-full bg-white text-[#4a3b2b] flex items-center justify-center text-sm font-bold border border-[#d8c8b5]" title="置顶或下移">
            ⬆️
          </button>
          <!-- 🔄 复合旋转与缩放手柄 -->
          <div id="pinTransform" class="handle-pin absolute -bottom-4 -right-4 w-8 h-8 rounded-full bg-[#e76f51] text-white flex items-center justify-center text-sm font-bold border-2 border-white cursor-nwse-resize shadow-xl" title="按住拖拽自由旋转和缩放">
            🔄
          </div>
        </div>
      </div>
    </div>

    <!-- 顶层极简浮动 HUD (手帐工具条) -->
    <header class="absolute top-3 left-3 right-3 flex items-center justify-between z-30 pointer-events-none">
      
      <!-- 地板材质胶带切换 -->
      <div class="pointer-events-auto bg-white/90 backdrop-blur-md px-3 py-1.5 rounded-full border border-[#decbb8] flex items-center gap-1.5 shadow-md">
        <span class="text-xs text-[#7d6752] font-semibold">🪵 地面:</span>
        <select id="floorSelect" class="bg-transparent text-xs text-[#4a3a2a] font-bold outline-none cursor-pointer">
          <option value="wood" selected>实木地板条</option>
          <option value="tile">复古棋盘格</option>
          <option value="grass">春日绿草坪</option>
          <option value="none">纯纸面留白</option>
        </select>
      </div>

      <!-- 右侧控制胶囊 -->
      <div class="pointer-events-auto flex items-center gap-1.5 bg-white/90 backdrop-blur-md p-1 rounded-full border border-[#decbb8] shadow-md">
        <!-- 白噪音氛围 -->
        <button id="ambientBtn" class="px-2.5 py-1 rounded-full text-xs text-[#5a4837] font-semibold hover:bg-stone-100 active:scale-95 transition-all flex items-center gap-1" title="切换背景白噪音">
          <span id="ambientIcon">🌧️</span>
          <span id="ambientLabel" class="text-[11px] hidden sm:inline">雨声</span>
        </button>

        <!-- 🔮 AI定制 2D 平面贴纸 -->
        <button id="openAiBtn" class="px-2.5 py-1 rounded-full text-xs bg-gradient-to-r from-orange-500 to-amber-500 text-white font-bold shadow-xs active:scale-95 transition-all flex items-center gap-1" title="Grok AI 实时画 2D 平面贴纸">
          <span>🔮</span><span class="text-[11px]">AI定制</span>
        </button>

        <!-- 清空重置 -->
        <button id="clearBtn" class="p-1.5 rounded-full text-xs text-red-500 hover:bg-red-50 active:scale-95 transition-all" title="清空画板，从一张白纸重新开始">
          🗑️
        </button>

        <!-- 保存手帐相片 -->
        <button id="exportBtn" class="px-3 py-1 rounded-full text-xs bg-[#e76f51] text-white font-bold shadow-md hover:bg-[#d95d3f] active:scale-95 transition-all flex items-center gap-1">
          <span>📸</span><span>保存</span>
        </button>
      </div>
    </header>

    <!-- 0 贴纸空白手帐开局提示 -->
    <div id="blankStartHint" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none text-center px-6 z-20 transition-opacity duration-300">
      <div class="bg-white/95 backdrop-blur-md border-2 border-[#d9ccba] text-[#4a3b2b] px-6 py-4 rounded-3xl shadow-xl flex flex-col items-center gap-1.5 max-w-xs">
        <span class="text-3xl animate-bounce">📔</span>
        <h2 class="text-sm font-bold tracking-tight">纯 2D 平面手帐造景</h2>
        <p class="text-[11px] text-[#786450] leading-relaxed">
          面对完全平整的手帐纸张，先在墙上贴一扇窗，再在平直地板上摆放桌椅与猫咪，享受纯正手帐拼贴！
        </p>
        <span class="text-[10px] text-orange-600 font-semibold mt-1">👇 点击下方抽屉挑选第一张贴纸</span>
      </div>
    </div>

    <!-- 底部抽屉式离型贴纸册 (纯平面正视分类) -->
    <footer id="stickerDrawer" class="absolute bottom-0 left-0 right-0 z-30 flex flex-col bg-[#f5ede1] border-t-2 border-[#d9ccba] shadow-[0_-6px_25px_rgba(0,0,0,0.15)] rounded-t-3xl overflow-hidden max-h-[340px]">
      
      <!-- 抽屉顶部把手与分类标签栏 -->
      <div id="drawerHeader" class="px-3 pt-2 pb-1.5 flex flex-col gap-1 border-b border-[#dfd0bd] bg-[#ede1cf] cursor-pointer">
        <div class="w-10 h-1 rounded-full bg-[#baa691] mx-auto opacity-75"></div>

        <div class="flex items-center justify-between gap-1 overflow-x-auto no-scrollbar pt-1">
          <div class="flex items-center gap-1 shrink-0">
            <button data-cat="windows" class="cat-tab px-2.5 py-1 rounded-full text-xs font-semibold bg-[#e76f51] text-white transition-all shadow-xs">
              🪟 ①平视门窗
            </button>
            <button data-cat="furniture" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🛋️ ②正视家具
            </button>
            <button data-cat="plants" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🌿 ③垂挂绿植
            </button>
            <button data-cat="pets" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              🐱 ④治愈萌宠
            </button>
            <button data-cat="props" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              ☕ ⑤桌面微缩
            </button>
            <button data-cat="custom" class="cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all">
              ✨ ⑥我的定制
            </button>
          </div>
          <button id="toggleDrawerBtn" class="shrink-0 p-1 text-xs text-[#8c7866] font-bold">
            ▼
          </button>
        </div>
      </div>

      <!-- 纯平面贴纸册卡片展示网格 -->
      <div id="stickersGrid" class="p-3 grid grid-cols-4 sm:grid-cols-6 gap-2.5 overflow-y-auto max-h-[220px] no-scrollbar bg-[#f8f2e9]">
        <!-- 动态渲染贴纸卡片 -->
      </div>
    </footer>

  </div>

  <!-- 🔮 Grok AI 贴纸工坊模态框 (强制纯 2D 平面正视模式) -->
  <div id="aiModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#faf6f0] rounded-3xl p-5 max-w-sm w-full flex flex-col gap-3.5 border border-[#e5d8c7] shadow-2xl relative">
      <button id="closeAiBtn" class="absolute top-4 right-4 w-7 h-7 rounded-full bg-stone-200 text-stone-600 flex items-center justify-center text-sm font-bold">
        ✕
      </button>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-xl">🔮</span>
          <h3 class="font-bold text-base text-[#4a3b2b]">Grok AI 2D平面贴纸工坊</h3>
        </div>
        <p class="text-xs text-[#826f5d] mt-1">自动绘制横平竖直的正视立面贴纸，与手帐完美贴合！</p>
      </div>

      <!-- 灵感 Chips -->
      <div class="flex flex-wrap gap-1.5">
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🪟 法式落地双开拱门窗</span>
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🍰 草莓千层切件蛋糕</span>
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🛋️ 复古墨绿色丝绒双人沙发</span>
        <span class="prompt-chip text-[11px] px-2 py-1 bg-white border border-[#decbb8] rounded-lg text-[#6d5b4a] cursor-pointer active:scale-95">🐈 趴在桌面打盹的银渐层猫咪</span>
      </div>

      <div class="flex flex-col gap-2">
        <input id="aiInput" type="text" placeholder="输入想要的贴纸，如：日系木制双层餐边柜..." class="w-full px-3.5 py-2.5 rounded-xl border border-[#d8c8b5] bg-white text-xs outline-none focus:ring-2 focus:ring-[#e76f51] text-[#4a3b2b]">
        <button id="doGenerateBtn" class="w-full py-2.5 rounded-xl bg-gradient-to-r from-[#e76f51] to-[#f4a261] text-white text-xs font-bold shadow-md active:scale-95 transition-all flex items-center justify-center gap-1.5">
          <span id="aiSpinner" class="hidden animate-spin">⏳</span>
          <span id="aiBtnText">✨ 绘制纯 2D 平面贴纸</span>
        </button>
      </div>
      <div id="aiStatus" class="text-[11px] text-center text-[#8d7966] hidden">
        Grok 正在以 2D 平面正视角绘制与透明抠图，约 10 秒...
      </div>
    </div>
  </div>

  <!-- 📸 导出高清手帐海报模态框 -->
  <div id="exportModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="bg-[#faf6f0] rounded-3xl p-5 max-w-sm w-full flex flex-col items-center gap-4 border border-[#e5d8c7] shadow-2xl">
      <div class="text-center">
        <h3 class="font-bold text-base text-[#4a3b2b]">🎉 你的手帐造景已完成！</h3>
        <p class="text-xs text-[#826f5d] mt-1">纯 2D 平面手作微缩空间，长按保存相片</p>
      </div>
      <div class="w-full rounded-2xl overflow-hidden border-4 border-white shadow-xl bg-stone-900">
        <img id="exportPreview" src="" alt="Journal Export" class="w-full h-auto block">
      </div>
      <div class="flex items-center gap-2 w-full">
        <button id="closeExportBtn" class="flex-1 py-2.5 rounded-xl bg-white border border-[#d8c8b5] text-xs font-semibold text-[#6f5e4d] active:scale-95">
          返回继续拼贴
        </button>
        <a id="downloadBtn" download="my_flat_journal_diorama.png" class="flex-1 py-2.5 text-center rounded-xl bg-[#e76f51] text-white text-xs font-bold shadow-md active:scale-95">
          📥 下载到手机
        </a>
      </div>
    </div>
  </div>

  <script>
    /* ==========================================================================
       1. 手帐专用 ASMR 撕贴音效与白噪音
       ========================================================================== */
    class JournalAudioEngine {
      constructor() {
        this.ctx = null;
        this.ambience = 'rain';
        this.nodes = [];
      }
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) this.ctx = new AC();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      cycleAmbience() {
        this.init();
        const list = ['rain', 'fire', 'lofi', 'mute'];
        const next = list[(list.indexOf(this.ambience) + 1) % list.length];
        this.setAmbience(next);
      }
      setAmbience(mode) {
        this.stopAmbience();
        this.ambience = mode;
        const icon = document.getElementById('ambientIcon');
        const label = document.getElementById('ambientLabel');

        if (mode === 'rain') {
          icon.innerText = '🌧️';
          label.innerText = '雨声';
          this.playRain();
        } else if (mode === 'fire') {
          icon.innerText = '🪵';
          label.innerText = '壁炉';
          this.playFire();
        } else if (mode === 'lofi') {
          icon.innerText = '🎵';
          label.innerText = 'Lofi';
          this.playLofi();
        } else {
          icon.innerText = '🔇';
          label.innerText = '静音';
        }
      }
      stopAmbience() {
        this.nodes.forEach(n => {
          try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        this.nodes = [];
      }
      playRain() {
        if (!this.ctx) return;
        try {
          const sz = this.ctx.sampleRate * 2;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = Math.random() * 2 - 1;
          const src = this.ctx.createBufferSource();
          src.buffer = b;
          src.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'lowpass';
          f.frequency.value = 850;
          const g = this.ctx.createGain();
          g.gain.value = 0.08;
          src.connect(f);
          f.connect(g);
          g.connect(this.ctx.destination);
          src.start();
          this.nodes.push(src, f, g);
        } catch (e) {}
      }
      playFire() {
        if (!this.ctx) return;
        try {
          const sz = this.ctx.sampleRate * 2;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
          const src = this.ctx.createBufferSource();
          src.buffer = b;
          src.loop = true;
          const f = this.ctx.createBiquadFilter();
          f.type = 'lowpass';
          f.frequency.value = 350;
          const g = this.ctx.createGain();
          g.gain.value = 0.12;
          src.connect(f);
          f.connect(g);
          g.connect(this.ctx.destination);
          src.start();
          this.nodes.push(src, f, g);
        } catch (e) {}
      }
      playLofi() {
        if (!this.ctx) return;
        const chords = [
          [261.63, 329.63, 392.00, 493.88],
          [220.00, 261.63, 329.63, 392.00],
          [174.61, 220.00, 261.63, 329.63]
        ];
        let idx = 0;
        const timer = setInterval(() => {
          if (this.ambience !== 'lofi' || !this.ctx) {
            clearInterval(timer);
            return;
          }
          const chord = chords[idx];
          idx = (idx + 1) % chords.length;
          chord.forEach((freq, i) => {
            setTimeout(() => {
              if (this.ambience !== 'lofi' || !this.ctx) return;
              try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0005, this.ctx.currentTime + 1.6);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 1.6);
              } catch (e) {}
            }, i * 120);
          });
        }, 3200);
      }
      // 撕贴纸声
      playPeel() {
        this.init();
        if (!this.ctx) return;
        try {
          const sz = this.ctx.sampleRate * 0.12;
          const b = this.ctx.createBuffer(1, sz, this.ctx.sampleRate);
          const d = b.getChannelData(0);
          for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sz * 0.35));
          const src = this.ctx.createBufferSource();
          src.buffer = b;
          const f = this.ctx.createBiquadFilter();
          f.type = 'bandpass';
          f.frequency.setValueAtTime(1600, this.ctx.currentTime);
          f.frequency.exponentialRampToValueAtTime(3600, this.ctx.currentTime + 0.1);
          const g = this.ctx.createGain();
          g.gain.setValueAtTime(0.32, this.ctx.currentTime);
          g.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          src.connect(f);
          f.connect(g);
          g.connect(this.ctx.destination);
          src.start();
          if (navigator.vibrate) navigator.vibrate(10);
        } catch (e) {}
      }
      // 贴平纸张 Pop 声
      playStick() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(420, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(110, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.09);
          if (navigator.vibrate) navigator.vibrate([12, 20, 8]);
        } catch (e) {}
      }
      playClick() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(950, this.ctx.currentTime);
          gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.025);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.025);
          if (navigator.vibrate) navigator.vibrate(6);
        } catch (e) {}
      }
      playDelete() {
        this.init();
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(260, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(60, this.ctx.currentTime + 0.16);
          gain.gain.setValueAtTime(0.28, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.16);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.16);
        } catch (e) {}
      }
    }
    const audio = new JournalAudioEngine();

    let customFlatStickers = JSON.parse(localStorage.getItem('my_flat_custom_stickers') || '[]');

    /* ==========================================================================
       3. 核心手帐造景逻辑 (1:1 平面自由排版，无斜角崩坏)
       ========================================================================== */
    class FlatDioramaApp {
      constructor() {
        this.placedStickers = []; // 初始空旷，完全由玩家亲手打造！
        this.activeId = null;
        this.currentCategory = 'windows';
        this.globalZ = 100;

        // DOM
        this.viewport = document.getElementById('journalViewport');
        this.canvas = document.getElementById('journalCanvas');
        this.container = document.getElementById('stickerContainer');
        this.floor = document.getElementById('floorStrip');
        this.overlay = document.getElementById('selectionOverlay');
        this.selectionBox = document.getElementById('selectionBox');
        this.drawer = document.getElementById('stickerDrawer');
        this.grid = document.getElementById('stickersGrid');
        this.hint = document.getElementById('blankStartHint');

        this.init();
      }

      init() {
        this.renderDrawer(this.currentCategory);
        this.bindEvents();
        this.bindControls();
      }

      setFloor(type) {
        this.floor.className = 'absolute bottom-0 left-0 right-0 pointer-events-none transition-all duration-300';
        if (type === 'wood') {
          this.floor.classList.add('floor-wood-strip', 'h-[22%]');
        } else if (type === 'tile') {
          this.floor.classList.add('floor-tile-strip', 'h-[22%]');
        } else if (type === 'grass') {
          this.floor.classList.add('floor-grass-strip', 'h-[22%]');
        } else {
          this.floor.classList.add('h-0', 'opacity-0');
        }
        audio.playClick();
      }

      renderDrawer(cat) {
        this.currentCategory = cat;
        const all = [...customFlatStickers, ...FLAT_STICKER_LIBRARY];
        const list = cat === 'custom' ? customFlatStickers : all.filter(s => s.cat === cat);

        if (list.length === 0) {
          this.grid.innerHTML = `
            <div class="col-span-4 sm:col-span-6 py-8 text-center text-xs text-[#8c7866]">
              暂无贴纸，点击顶部「🔮 AI定制」画一张纯 2D 贴纸！
            </div>
          `;
          return;
        }

        this.grid.innerHTML = list.map(item => `
          <div class="sticker-tray-card rounded-2xl p-1.5 flex flex-col items-center justify-between border border-[#decbb8] cursor-pointer" data-id="${item.id}">
            <div class="w-full h-14 flex items-center justify-center p-0.5 pointer-events-none">
              <img src="${item.img}" alt="${item.name}" class="max-w-full max-h-full object-contain filter drop-shadow(0 2px 4px rgba(0,0,0,0.12))">
            </div>
            <span class="text-[10px] text-[#735e4b] font-medium tracking-tight mt-1 truncate w-full text-center pointer-events-none">
              ${item.name}
            </span>
          </div>
        `).join('');
      }

      addSticker(templateId, initialPos = null) {
        const all = [...customFlatStickers, ...FLAT_STICKER_LIBRARY];
        const tpl = all.find(s => s.id === templateId);
        if (!tpl) return;

        audio.playPeel();

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const posX = initialPos ? initialPos.x : (vw / 2 - tpl.width / 2);
        const posY = initialPos ? initialPos.y : (vh / 2 - tpl.height / 2 - 40);

        this.globalZ += 1;
        const instance = {
          uid: 'stk_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4),
          templateId: tpl.id,
          name: tpl.name,
          img: tpl.img,
          x: Math.max(10, Math.min(vw - tpl.width, posX)),
          y: Math.max(10, Math.min(vh - tpl.height, posY)),
          width: tpl.width,
          height: tpl.height,
          rotation: 0,
          scale: 1,
          flipped: false,
          zIndex: tpl.baseZ ? tpl.baseZ : this.globalZ
        };

        this.placedStickers.push(instance);
        this.renderAll();
        this.selectSticker(instance.uid);

        setTimeout(() => audio.playStick(), 60);
        this.updateHint();
        this.collapseDrawer();
      }

      renderAll() {
        this.container.innerHTML = '';
        this.placedStickers.forEach(item => {
          const el = document.createElement('div');
          el.id = item.uid;
          el.className = 'flat-sticker-node';
          el.style.width = item.width + 'px';
          el.style.height = item.height + 'px';
          el.style.left = item.x + 'px';
          el.style.top = item.y + 'px';
          el.style.zIndex = item.zIndex;

          const transformStr = `rotate(${item.rotation}deg) scale(${item.scale}) scaleX(${item.flipped ? -1 : 1})`;
          el.style.transform = transformStr;

          el.innerHTML = `
            <img src="${item.img}" class="pointer-events-none">
          `;

          this.attachPointerGestures(el, item);
          this.container.appendChild(el);
        });

        this.updateSelectionBoxPosition();
      }

      // 60fps 丝滑触控与双指捏合
      attachPointerGestures(el, item) {
        let isDragging = false;
        let startX, startY;
        let origX, origY;
        let activePointers = new Map();
        let initialDistance = 0;
        let initialScale = 1;

        const onPointerDown = (e) => {
          e.stopPropagation();
          this.selectSticker(item.uid);
          audio.playPeel();

          el.setPointerCapture(e.pointerId);
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (activePointers.size === 1) {
            isDragging = true;
            el.classList.add('is-dragging');
            startX = e.clientX;
            startY = e.clientY;
            origX = item.x;
            origY = item.y;
          } else if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            initialDistance = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            initialScale = item.scale;
          }
        };

        const onPointerMove = (e) => {
          if (!activePointers.has(e.pointerId)) return;
          activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

          if (activePointers.size === 1 && isDragging) {
            const deltaX = e.clientX - startX;
            const deltaY = e.clientY - startY;
            item.x = origX + deltaX;
            item.y = origY + deltaY;

            // 水平地面磁吸对齐 (当家具贴到底部地面附近时，平整对齐地面)
            const floorTop = window.innerHeight * 0.78;
            const stickerBottom = item.y + item.height * item.scale;
            if (Math.abs(stickerBottom - floorTop) < 18) {
              item.y = floorTop - item.height * item.scale;
            }

            el.style.left = item.x + 'px';
            el.style.top = item.y + 'px';
            this.updateSelectionBoxPosition();
          } else if (activePointers.size === 2) {
            const pts = Array.from(activePointers.values());
            const curDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
            if (initialDistance > 0) {
              item.scale = Math.max(0.3, Math.min(3.2, initialScale * (curDist / initialDistance)));
              el.style.transform = `rotate(${item.rotation}deg) scale(${item.scale}) scaleX(${item.flipped ? -1 : 1})`;
              this.updateSelectionBoxPosition();
            }
          }
        };

        const onPointerUp = (e) => {
          try { el.releasePointerCapture(e.pointerId); } catch (err) {}
          activePointers.delete(e.pointerId);

          if (activePointers.size === 0 && isDragging) {
            isDragging = false;
            el.classList.remove('is-dragging');
            audio.playStick();
          }
        };

        el.addEventListener('pointerdown', onPointerDown);
        el.addEventListener('pointermove', onPointerMove);
        el.addEventListener('pointerup', onPointerUp);
        el.addEventListener('pointercancel', onPointerUp);
      }

      selectSticker(uid) {
        this.activeId = uid;
        this.overlay.classList.remove('hidden');
        this.updateSelectionBoxPosition();
      }

      deselectAll() {
        this.activeId = null;
        this.overlay.classList.add('hidden');
      }

      getActive() {
        return this.placedStickers.find(s => s.uid === this.activeId);
      }

      updateSelectionBoxPosition() {
        const active = this.getActive();
        if (!active || !this.activeId) {
          this.overlay.classList.add('hidden');
          return;
        }

        const padding = 12;
        const w = active.width * active.scale;
        const h = active.height * active.scale;
        const cx = active.x + active.width / 2;
        const cy = active.y + active.height / 2;

        this.selectionBox.style.width = (w + padding * 2) + 'px';
        this.selectionBox.style.height = (h + padding * 2) + 'px';
        this.selectionBox.style.left = (cx - (w + padding * 2) / 2) + 'px';
        this.selectionBox.style.top = (cy - (h + padding * 2) / 2) + 'px';
        this.selectionBox.style.transform = `rotate(${active.rotation}deg)`;
        this.overlay.classList.remove('hidden');
      }

      bindControls() {
        document.getElementById('pinFlip').addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const active = this.getActive();
          if (!active) return;
          active.flipped = !active.flipped;
          this.renderAll();
          audio.playClick();
        });

        document.getElementById('pinDelete').addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          if (!this.activeId) return;
          const target = document.getElementById(this.activeId);
          if (target) {
            target.style.transition = 'all 0.15s ease-out';
            target.style.transform += ' scale(0)';
            target.style.opacity = '0';
          }
          audio.playDelete();
          setTimeout(() => {
            this.placedStickers = this.placedStickers.filter(s => s.uid !== this.activeId);
            this.deselectAll();
            this.renderAll();
            this.updateHint();
          }, 150);
        });

        document.getElementById('pinLayer').addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const active = this.getActive();
          if (!active) return;
          this.globalZ += 1;
          active.zIndex = this.globalZ;
          this.renderAll();
          audio.playClick();
        });

        const handle = document.getElementById('pinTransform');
        let isT = false;
        let startAngle = 0;
        let startDist = 0;
        let initRot = 0;
        let initScale = 1;

        handle.addEventListener('pointerdown', (e) => {
          e.stopPropagation();
          const active = this.getActive();
          if (!active) return;

          handle.setPointerCapture(e.pointerId);
          isT = true;
          audio.playClick();

          const rect = this.container.getBoundingClientRect();
          const cx = rect.left + active.x + active.width / 2;
          const cy = rect.top + active.y + active.height / 2;

          startAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
          startDist = Math.hypot(e.clientX - cx, e.clientY - cy);
          initRot = active.rotation;
          initScale = active.scale;

          const onPointerMove = (mEvt) => {
            if (!isT) return;
            const curAngle = Math.atan2(mEvt.clientY - cy, mEvt.clientX - cx);
            const curDist = Math.hypot(mEvt.clientX - cy, mEvt.clientX - cx);

            const deltaRot = (curAngle - startAngle) * (180 / Math.PI);
            active.rotation = Math.round((initRot + deltaRot) % 360);

            const scaleMul = curDist / (startDist || 1);
            active.scale = Math.max(0.3, Math.min(3.2, initScale * scaleMul));

            const targetEl = document.getElementById(active.uid);
            if (targetEl) {
              targetEl.style.transform = `rotate(${active.rotation}deg) scale(${active.scale}) scaleX(${active.flipped ? -1 : 1})`;
            }
            this.updateSelectionBoxPosition();
          };

          const onPointerUp = (uEvt) => {
            try { handle.releasePointerCapture(uEvt.pointerId); } catch (err) {}
            isT = false;
            window.removeEventListener('pointermove', onPointerMove);
            window.removeEventListener('pointerup', onPointerUp);
          };

          window.addEventListener('pointermove', onPointerMove);
          window.addEventListener('pointerup', onPointerUp);
        });
      }

      collapseDrawer() {
        this.drawer.classList.add('is-collapsed');
        document.getElementById('toggleDrawerBtn').innerText = '▲';
      }

      expandDrawer() {
        this.drawer.classList.remove('is-collapsed');
        document.getElementById('toggleDrawerBtn').innerText = '▼';
      }

      updateHint() {
        this.hint.style.opacity = this.placedStickers.length === 0 ? '1' : '0';
      }

      bindEvents() {
        document.getElementById('floorSelect').addEventListener('change', (e) => {
          this.setFloor(e.target.value);
        });

        document.getElementById('drawerHeader').addEventListener('click', (e) => {
          if (e.target.closest('.cat-tab')) return;
          if (this.drawer.classList.contains('is-collapsed')) {
            this.expandDrawer();
          } else {
            this.collapseDrawer();
          }
          audio.playClick();
        });

        document.querySelectorAll('.cat-tab').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            audio.playClick();
            document.querySelectorAll('.cat-tab').forEach(b => {
              b.className = 'cat-tab px-2.5 py-1 rounded-full text-xs font-medium bg-white text-[#6d5b4a] border border-[#d8c8b5] transition-all';
            });
            btn.className = 'cat-tab px-2.5 py-1 rounded-full text-xs font-semibold bg-[#e76f51] text-white transition-all shadow-xs';
            this.renderDrawer(btn.dataset.cat);
            this.expandDrawer();
          });
        });

        this.grid.addEventListener('click', (e) => {
          const card = e.target.closest('.sticker-tray-card');
          if (card) {
            this.addSticker(card.dataset.id);
          }
        });

        this.viewport.addEventListener('pointerdown', (e) => {
          if (e.target === this.viewport || e.target === this.canvas || e.target.id === 'floorStrip') {
            this.deselectAll();
          }
        });

        document.getElementById('ambientBtn').addEventListener('click', () => {
          audio.cycleAmbience();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
          if (this.placedStickers.length === 0) return;
          if (confirm('确定要清空吗？将重新面对一张干净的手帐纸！')) {
            this.placedStickers = [];
            this.deselectAll();
            this.renderAll();
            this.updateHint();
            audio.playDelete();
          }
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
          this.exportImage();
        });

        document.getElementById('closeExportBtn').addEventListener('click', () => {
          document.getElementById('exportModal').classList.add('hidden');
        });
      }

      // 拍立得 2D 手帐照片高清导出
      exportImage() {
        audio.playClick();
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = vw * scale;
        canvas.height = vh * scale;
        const ctx = canvas.getContext('2d');
        ctx.scale(scale, scale);

        // 1. 绘制手帐纸张底色
        ctx.fillStyle = '#faf5ec';
        ctx.fillRect(0, 0, vw, vh);

        // 2. 绘制网格线
        ctx.strokeStyle = 'rgba(180, 160, 140, 0.15)';
        ctx.lineWidth = 1;
        for (let x = 0; x < vw; x += 20) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, vh); ctx.stroke();
        }
        for (let y = 0; y < vh; y += 20) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(vw, y); ctx.stroke();
        }

        // 3. 绘制地面
        const floorType = document.getElementById('floorSelect').value;
        const floorH = vh * 0.22;
        const floorY = vh - floorH;

        if (floorType === 'wood') {
          const woodGrad = ctx.createLinearGradient(0, floorY, 0, vh);
          woodGrad.addColorStop(0, '#9b6c42');
          woodGrad.addColorStop(1, '#8d5e35');
          ctx.fillStyle = woodGrad;
          ctx.fillRect(0, floorY, vw, floorH);
          ctx.strokeStyle = '#633f20';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(vw, floorY); ctx.stroke();
        } else if (floorType === 'grass') {
          ctx.fillStyle = '#5b8c5a';
          ctx.fillRect(0, floorY, vw, floorH);
          ctx.strokeStyle = '#365935';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(0, floorY); ctx.lineTo(vw, floorY); ctx.stroke();
        }

        // 4. 按层级绘制所有贴纸
        const sorted = [...this.placedStickers].sort((a, b) => a.zIndex - b.zIndex);
        if (sorted.length === 0) {
          this.showExport(canvas.toDataURL('image/png'));
          return;
        }

        let loaded = 0;
        sorted.forEach(item => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            ctx.save();
            ctx.translate(item.x + item.width / 2, item.y + item.height / 2);
            ctx.rotate((item.rotation * Math.PI) / 180);
            ctx.scale(item.flipped ? -item.scale : item.scale, item.scale);
            ctx.drawImage(img, -item.width / 2, -item.height / 2, item.width, item.height);
            ctx.restore();

            loaded++;
            if (loaded === sorted.length) {
              // 手帐白边边框与日付印章
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 12;
              ctx.strokeRect(6, 6, vw - 12, vh - 12);
              ctx.font = 'bold 12px sans-serif';
              ctx.fillStyle = '#7a6856';
              ctx.fillText(`✨ 2D 平面手帐造景 · My Journal Room`, 24, vh - 22);

              this.showExport(canvas.toDataURL('image/png'));
            }
          };
          img.onerror = () => {
            loaded++;
            if (loaded === sorted.length) {
              this.showExport(canvas.toDataURL('image/png'));
            }
          };
          img.src = item.img;
        });
      }

      showExport(dataUrl) {
        document.getElementById('exportPreview').src = dataUrl;
        document.getElementById('downloadBtn').href = dataUrl;
        document.getElementById('exportModal').classList.remove('hidden');
      }
    }

    /* ==========================================================================
       4. 🔮 Grok AI 2D 平面贴纸工坊 (注入纯正视图提示词)
       ========================================================================== */
    class FlatAiWorkshop {
      constructor(app) {
        this.app = app;
        this.apiKey = 'sk-Tkh8xl7XqIlbiGje1wI9g6HJBnCSZqFBm2W9ym5Q';
        this.modal = document.getElementById('aiModal');
        this.input = document.getElementById('aiInput');
        this.btn = document.getElementById('doGenerateBtn');
        this.spinner = document.getElementById('aiSpinner');
        this.btnText = document.getElementById('aiBtnText');
        this.status = document.getElementById('aiStatus');

        this.bindEvents();
      }

      bindEvents() {
        document.getElementById('openAiBtn').addEventListener('click', () => {
          this.modal.classList.remove('hidden');
          audio.playClick();
        });

        document.getElementById('closeAiBtn').addEventListener('click', () => {
          this.modal.classList.add('hidden');
        });

        document.querySelectorAll('.prompt-chip').forEach(chip => {
          chip.addEventListener('click', () => {
            this.input.value = chip.innerText.replace(/^[^\s]+\s*/, '');
            audio.playClick();
          });
        });

        this.btn.addEventListener('click', () => this.generate());
      }

      async generate() {
        const val = this.input.value.trim();
        if (!val) {
          alert('请先输入想画的物品名称！');
          return;
        }

        this.btn.disabled = true;
        this.spinner.classList.remove('hidden');
        this.btnText.innerText = 'Grok 正在绘制 2D 正视角...';
        this.status.classList.remove('hidden');
        audio.playPeel();

        // 强约束：纯 2D 平视立面
        const fullPrompt = `Die-cut sticker of ${val}, pure 2D flat front elevation view, straight front facing, cute flat anime cartoon sticker, thick white sticker border outline, solid pure white background, flat 2d scrapbooking design`;

        try {
          const resp = await fetch('https://img.pipiwangcom.com/v1/images/generations', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${this.apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'grok-2-imageGen',
              prompt: fullPrompt,
              n: 1,
              size: '1024x1024'
            })
          });

          const data = await resp.json();
          if (!data.data || !data.data[0] || !data.data[0].url) {
            throw new Error('未返回有效图片');
          }

          const rawUrl = data.data[0].url;
          this.btnText.innerText = '正在进行背景透明处理...';

          const transparentPng = await this.removeWhite(rawUrl);

          const newSticker = {
            id: 'flat_custom_' + Date.now(),
            cat: 'custom',
            name: val.slice(0, 8),
            img: transparentPng,
            width: 95,
            height: 95
          };

          customFlatStickers.unshift(newSticker);
          localStorage.setItem('my_flat_custom_stickers', JSON.stringify(customFlatStickers));

          this.modal.classList.add('hidden');
          this.input.value = '';
          this.app.renderDrawer('custom');
          this.app.addSticker(newSticker.id);
          audio.playStick();

          alert('🎉 你的纯 2D 平面贴纸已绘制完成，已贴入房间！');
        } catch (e) {
          alert('绘制失败，请重试：' + (e.message || e));
        } finally {
          this.btn.disabled = false;
          this.spinner.classList.add('hidden');
          this.btnText.innerText = '✨ 绘制纯 2D 平面贴纸';
          this.status.classList.add('hidden');
        }
      }

      removeWhite(url) {
        return new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = 'anonymous';
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const targetSize = 400;
            canvas.width = targetSize;
            canvas.height = targetSize;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, targetSize, targetSize);

            const imgData = ctx.getImageData(0, 0, targetSize, targetSize);
            const d = imgData.data;
            const w = targetSize;
            const h = targetSize;

            const visited = new Uint8Array(w * h);
            const queue = [];

            const isWhite = (x, y) => {
              const idx = (y * w + x) * 4;
              return d[idx] > 232 && d[idx+1] > 232 && d[idx+2] > 232;
            };

            for (let x = 0; x < w; x++) {
              if (isWhite(x, 0)) { queue.push(x, 0); visited[x] = 1; }
              if (isWhite(x, h - 1)) { queue.push(x, h - 1); visited[(h - 1) * w + x] = 1; }
            }
            for (let y = 0; y < h; y++) {
              if (isWhite(0, y) && !visited[y * w]) { queue.push(0, y); visited[y * w] = 1; }
              if (isWhite(w - 1, y) && !visited[y * w + (w - 1)]) { queue.push(w - 1, y); visited[y * w + (w - 1)] = 1; }
            }

            let head = 0;
            while (head < queue.length) {
              const cx = queue[head++];
              const cy = queue[head++];
              const idx = (cy * w + cx) * 4;
              d[idx + 3] = 0;

              const neighbors = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
              for (let [nx, ny] of neighbors) {
                if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
                  const nPos = ny * w + nx;
                  if (!visited[nPos] && isWhite(nx, ny)) {
                    visited[nPos] = 1;
                    queue.push(nx, ny);
                  }
                }
              }
            }

            ctx.putImageData(imgData, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          };
          img.onerror = () => resolve(url);
          img.src = url;
        });
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.app = new FlatDioramaApp();
      window.aiWorkshop = new FlatAiWorkshop(window.app);
    });
  </script>
